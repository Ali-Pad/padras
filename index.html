<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#252525"><title>پادراس | بازی‌ها</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909;color:#fff;font-family:Tahoma,Arial}#app{height:100%;width:100%;max-width:560px;margin:auto;background:#101010;position:relative;overflow:hidden}header{height:70px;background:#303030;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:19px}header b{color:#ffc52e}#home{height:calc(100% - 70px);overflow:auto;background:radial-gradient(ellipse at 50% 20%,#3a0b42,#16001d 65%,#08020b);padding:25px 18px 45px}.brand{text-align:center;color:#ff6429;font-size:42px;font-weight:bold;margin:20px 0 8px}.sub{text-align:center;color:#eadbea;margin-bottom:28px}.card{border:5px solid #171313;border-radius:24px;background:linear-gradient(#ff692d 0 52%,#e94d1e 52%);color:#160904;padding:18px;margin:16px auto;max-width:420px;box-shadow:0 7px 0 #090509;text-align:center}.card strong{display:block;font-size:24px;margin-bottom:8px}.card span{font-size:14px}.card button{margin-top:13px;border:3px solid #21100a;border-radius:14px;background:#ffb13b;padding:10px 28px;font-weight:bold;font-size:18px}#view{display:none;position:absolute;inset:70px 0 0;background:#000;z-index:4}#frame{width:100%;height:100%;border:0;display:block}#leaderboardBtn{display:block;margin:0 auto 22px;border:4px solid #171313;border-radius:16px;background:#ffc52e;color:#241000;padding:12px 24px;font-size:18px;font-weight:bold;box-shadow:0 5px 0 #090509}#board{display:none;position:absolute;inset:70px 0 0;z-index:6;overflow:auto;background:radial-gradient(ellipse at 50% 10%,#3a0b42,#16001d 70%,#08020b);padding:20px 14px 35px}#board h2{text-align:center;color:#ff6429;font-size:28px;margin:8px 0 18px}.boardTop{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}.boardTop button{border:2px solid #21100a;border-radius:12px;background:#ffb13b;padding:9px 13px;font-weight:bold}.boardTop button.active{background:#ff6429;color:#fff}.boardTable{width:100%;border-collapse:collapse;background:#24112b;border-radius:12px;overflow:hidden}.boardTable th,.boardTable td{padding:11px 5px;text-align:center;border-bottom:1px solid #59315e;font-size:13px}.boardTable th{background:#ff6429;color:#190a05}.boardTable tr:nth-child(even){background:#32163a}.boardEmpty{text-align:center;color:#eadbea;line-height:2;padding:24px}.boardBack{display:block;margin:18px auto;border:4px solid #171313;border-radius:14px;background:#ff6429;padding:10px 30px;font-size:18px;font-weight:bold;color:#190a05}#view{display:none;position:absolute;inset:70px 0 0;background:#000;z-index:4}#frame{width:100%;height:100%;border:0;display:block}</style></head><body><main id="app"><header><span>بازی‌های <b>پادراس</b></span><span>رایگان 🎮</span></header><section id="home"><div class="brand">پادراس</div><div class="sub">بازی کن، امتیاز بگیر و رکوردت را بشکن!</div><button id="leaderboardBtn" type="button">🏆 جدول امتیازات بازیکنان</button><div class="card"><strong>🔪 پرتاب چاقو</strong><span>۳۰ مرحله؛ سیب‌ها را بزن و سکه جمع کن.</span><br><button onclick="openGame('knife')">شروع بازی</button></div><div class="card"><strong>☂️ سقوط چتری</strong><span>از میان چرخ‌دنده‌ها عبور کن و سقوط نکن!</span><br><button onclick="openGame('umbrella')">شروع بازی</button></div><div class="card"><strong>💣 بمب‌گذار</strong><span>در هزارتو حرکت کن، بمب بگذار و دشمن‌ها را شکست بده.</span><br><button onclick="openGame('bomber')">شروع بازی</button></div></section><section id="board"><h2>🏆 جدول امتیازات</h2><div class="boardTop"><button class="active" data-filter="all">همه بازی‌ها</button><button data-filter="knife">پرتاب چاقو</button><button data-filter="umbrella">سقوط چتری</button><button data-filter="bomber">بمب‌گذار</button></div><div id="boardContent"></div><button class="boardBack" id="boardBack">بازگشت</button></section><section id="view"><iframe id="frame" title="بازی" sandbox="allow-scripts allow-same-origin allow-pointer-lock" allow="fullscreen; autoplay"></iframe></section></main><script>const games={"knife": "<!doctype html>\n<html lang=\"fa\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#08030b\">\n<title>پادراس | پرتاب چاقو</title>\n<style>\n*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08030b;color:#fff;font-family:Tahoma,Arial,sans-serif;touch-action:manipulation}\n#app{width:100%;height:100%;max-width:560px;margin:auto;position:relative;overflow:hidden;background:#08030b}\ncanvas{display:block;width:100%;height:100%;touch-action:manipulation}\n#hud{position:absolute;top:0;left:0;right:0;height:76px;background:#303030;display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:2;font-size:clamp(16px,4vw,21px)}\n#score{color:#ffc52e;font-weight:bold}\n#back{border:0;background:transparent;color:#ffc52e;font-size:32px;line-height:1;padding:4px 8px;cursor:pointer}\n#coinBox{position:absolute;z-index:2;top:100px;right:6%;min-width:132px;height:62px;padding:0 15px;border:6px solid #171313;border-radius:19px;background:#f45a20;color:#180b06;display:flex;align-items:center;justify-content:center;gap:10px;font-size:23px;font-weight:bold;box-shadow:inset 0 0 0 2px #a63d1b}\n#stageLabel{position:absolute;z-index:2;top:112px;left:6%;font-size:25px;color:#f45a20;font-weight:bold}\n#stageCount{position:absolute;z-index:2;top:178px;left:0;right:0;text-align:center;font-size:clamp(40px,10vw,58px);font-weight:bold;color:#f45a20;text-shadow:0 3px #561a16;pointer-events:none}\n#message{position:absolute;z-index:2;bottom:8px;left:0;right:0;text-align:center;color:#e9cde9;font-size:12px;pointer-events:none}\n#overlay{position:absolute;inset:76px 0 0;background:rgba(5,0,8,.93);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}\n#overlay.hidden{display:none}\n#overlayTitle{font-size:clamp(32px,8vw,46px);font-weight:bold;color:#f45a20;margin-bottom:14px}\n#overlayText{color:#eadbea;line-height:2;margin-bottom:26px;font-size:15px}\n#overlayButton{border:6px solid #171313;border-radius:20px;background:#f45a20;color:#180b06;padding:14px 38px;font-size:23px;font-weight:bold;cursor:pointer}\n</style>\n</head>\n<body>\n<main id=\"app\">\n<canvas id=\"gameCanvas\"></canvas>\n<header id=\"hud\">\n<button id=\"back\" aria-label=\"بازگشت\">←</button>\n<div>امتیاز شما: <span id=\"score\">۰</span></div>\n</header>\n<div id=\"stageLabel\">مرحله <span id=\"stage\">۱</span> / ۳۰</div>\n<div id=\"coinBox\"><span>🪙</span><span id=\"coins\">۰</span></div>\n<div id=\"stageCount\">۳</div>\n\n<div id=\"message\">برای پرتاب چاقو، هر جای صفحه بازی ضربه بزن</div>\n<section id=\"overlay\">\n<div id=\"overlayTitle\">پرتاب چاقو</div>\n<div id=\"overlayText\">برای پرتاب چاقو، فقط روی صفحه ضربه بزن!<br>چاقوها مثل تصویر از لبه چوب فرو می‌روند؛ سیب‌ها را بزن و تا مرحله ۳۰ پیش برو.</div>\n<button id=\"overlayButton\">شروع بازی</button>\n</section>\n</main>\n<script>\n(()=>{\n'use strict';\nconst canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);\nconst TAU=Math.PI*2,fa=n=>String(Math.floor(n)).replace(/\\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);\nlet W=0,H=0,DPR=1,cx=0,cy=0,R=0,state='menu';\nlet score=0,coins=0,stage=1,needed=3,thrown=0,rotation=0,spinSpeed=1.0;\nlet knives=[],apples=[],projectile=null,particles=[],lastTime=0,stagePause=0;\nfunction resize(){\n const rect=canvas.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);\n W=rect.width;H=rect.height;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);\n cx=W/2;R=Math.min(W*.345,178);cy=Math.min(H*.51,H-260);cy=Math.max(cy,H*.42);draw();\n}\naddEventListener('resize',resize);\nfunction hud(){\n $('score').textContent=fa(score);$('coins').textContent=fa(coins);$('stage').textContent=fa(stage);\n $('stageCount').textContent=fa(Math.max(0,needed-thrown));\n $('stageLabel').innerHTML=`مرحله <span id=\"stage\">${fa(stage)}</span> / ۳۰`;\n}\nfunction norm(a){a%=TAU;return a<0?a+TAU:a}\nfunction dist(a,b){let d=Math.abs(norm(a)-norm(b));return Math.min(d,TAU-d)}\nfunction applesForStage(){\n const count=Math.min(2+Math.floor((stage-1)/5),5);\n apples=[];\n // Put apples in varied positions around the outer ring, avoiding a fixed launch lane.\n for(let i=0;i<count;i++) apples.push({a:norm(.35+i*TAU/count+(stage%3)*.12),alive:true});\n}\nfunction difficulty(){\n // Rotation speeds up and alternates direction; later stages require more accurate timing.\n const magnitude=Math.min(.95+stage*.105,4.0);\n spinSpeed=(stage%4===0?-1:1)*magnitude;\n needed=Math.min(3+Math.floor((stage-1)/3),5);\n}\nfunction start(){\n score=0;coins=0;stage=1;thrown=0;rotation=0;knives=[];projectile=null;particles=[];stagePause=0;\n difficulty();applesForStage();state='playing';lastTime=0;\n $('overlay').classList.add('hidden');$('message').textContent='برای پرتاب چاقو، هر جای صفحه بازی ضربه بزن';hud();\n}\nfunction newStage(){\n if(stage>=30){\n  state='won';parent.postMessage({type:'padras-score',game:'knife',score:score},'*');$('overlayTitle').textContent='آفرین! قهرمان شدی 🏆';\n  $('overlayText').innerHTML=`همه ۳۰ مرحله را تمام کردی!<br>امتیاز نهایی: <b>${fa(score)}</b><br>سکه‌های جمع‌شده: <b>${fa(coins)}</b>`;\n  $('overlayButton').textContent='بازی دوباره';$('overlay').classList.remove('hidden');return;\n }\n stage++;thrown=0;knives=[];projectile=null;difficulty();applesForStage();hud();\n $('message').textContent=`مرحله ${fa(stage)}؛ سرعت بیشتر شد!`;\n}\nfunction lose(){\n state='over';projectile=null;parent.postMessage({type:'padras-score',game:'knife',score:score},'*');$('overlayTitle').textContent='بازی تمام شد!';\n $('overlayText').innerHTML=`مرحله: <b>${fa(stage)}</b> از ۳۰<br>امتیاز: <b>${fa(score)}</b><br>سکه‌ها: <b>${fa(coins)}</b><br>چاقو به یکی از چاقوهای قبلی برخورد کرد.`;\n $('overlayButton').textContent='تلاش دوباره';$('overlay').classList.remove('hidden');\n}\nfunction launch(){\n if(state!=='playing'||projectile||stagePause>0)return;\n projectile={y:H+65,fromY:H+65,progress:0};\n $('message').textContent='';\n}\nfunction particlesAt(x,y){\n for(let i=0;i<14;i++){let a=Math.random()*TAU,s=35+Math.random()*100;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.55,max:.55})}\n}\nfunction impact(){\n // Incoming knife always reaches the bottom edge. Convert that world angle to log-local angle.\n const local=norm(Math.PI-rotation);\n // More difficult stages narrow the safe gap between knives.\n const safeGap=Math.max(.13,.235-stage*.0025);\n if(knives.some(a=>dist(a,local)<safeGap)){lose();return}\n knives.push(local);thrown++;score++;\n const appleIndex=apples.findIndex(a=>a.alive&&dist(a.a,local)<.25);\n if(appleIndex>=0){\n  apples[appleIndex].alive=false;coins++;particlesAt(cx+Math.cos(apples[appleIndex].a+rotation)*R*.92,cy+Math.sin(apples[appleIndex].a+rotation)*R*.92);\n  $('message').textContent='آفرین! سیب را زدی؛ یک سکه گرفتی 🪙';\n }else $('message').textContent='چاقو به چوب نشست؛ ادامه بده!';\n hud();\n if(thrown>=needed)stagePause=.85;\n}\nfunction rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}\nfunction drawBackground(){\n ctx.fillStyle='#210027';ctx.fillRect(0,0,W,H);\n const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(7,0,14,.35)');g.addColorStop(.5,'rgba(90,0,90,.13)');g.addColorStop(1,'rgba(7,0,14,.35)');\n ctx.fillStyle=g;ctx.fillRect(0,76,W,H-76);\n for(let x=0;x<W;x+=Math.max(65,W*.19)){ctx.fillStyle='rgba(90,0,95,.07)';ctx.fillRect(x,76,3,H-76)}\n}\nfunction drawApple(x,y){\n ctx.save();ctx.translate(x,y);let s=R/175;ctx.scale(s,s);\n ctx.fillStyle='#238b36';ctx.beginPath();ctx.ellipse(5,-22,8,15,-.65,0,TAU);ctx.fill();\n let g=ctx.createRadialGradient(-9,-10,2,0,0,28);g.addColorStop(0,'#ff7862');g.addColorStop(.55,'#ed3029');g.addColorStop(1,'#a90917');\n ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-18);ctx.bezierCurveTo(-34,-34,-43,3,-20,24);ctx.bezierCurveTo(-8,37,8,37,21,24);ctx.bezierCurveTo(43,-2,29,-33,0,-18);ctx.fill();\n ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.ellipse(-13,-4,5,9,.5,0,TAU);ctx.fill();ctx.restore();\n}\nfunction drawEmbeddedKnife(a){\n // Radial knife: wooden handle stays outside the log, guard at the bark,\n // and the pale blade points inward into the wood, matching the reference.\n ctx.save();ctx.rotate(a);\n const edge=-R+3;\n ctx.fillStyle='#9b4d28';rr(-8,edge-83,16,43,4);ctx.fill();\n ctx.strokeStyle='#d88b4b';ctx.lineWidth=3;\n for(let y=edge-74;y<edge-45;y+=10){ctx.beginPath();ctx.moveTo(-7,y);ctx.lineTo(7,y);ctx.stroke()}\n ctx.fillStyle='#e8b96b';ctx.fillRect(-12,edge-42,24,7);\n ctx.fillStyle='#bdebf0';ctx.beginPath();ctx.moveTo(0,edge+3);ctx.lineTo(-8,edge-36);ctx.lineTo(8,edge-36);ctx.closePath();ctx.fill();\n ctx.fillStyle='#f7ffff';ctx.beginPath();ctx.moveTo(0,edge+3);ctx.lineTo(2,edge-34);ctx.lineTo(8,edge-36);ctx.closePath();ctx.fill();\n ctx.restore();\n}\nfunction drawLog(){\n ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);\n ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=18;ctx.shadowOffsetY=8;\n ctx.beginPath();ctx.arc(0,0,R,0,TAU);ctx.fillStyle='#c47c42';ctx.fill();ctx.shadowColor='transparent';\n ctx.beginPath();ctx.arc(0,0,R-10,0,TAU);ctx.fillStyle='#ffe86d';ctx.fill();\n ctx.lineWidth=9;ctx.strokeStyle='#f5ca58';ctx.beginPath();ctx.arc(0,0,R-24,0,TAU);ctx.stroke();\n for(let j=0;j<3;j++){\n  let r=R*(.72-j*.19);ctx.beginPath();\n  for(let i=0;i<=120;i++){let a=i/120*TAU,w=1+.035*Math.sin(a*3+j)+.018*Math.cos(a*5-j),x=Math.cos(a)*r*w,y=Math.sin(a)*r*w;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}\n  ctx.closePath();ctx.lineWidth=6;ctx.strokeStyle='#f3c34e';ctx.stroke();\n }\n // Rotate apples and embedded knives together with the log.\n apples.forEach(a=>{if(a.alive)drawApple(Math.cos(a.a-Math.PI/2)*R*.91,Math.sin(a.a-Math.PI/2)*R*.91)});\n knives.forEach(a=>drawEmbeddedKnife(a));\n ctx.restore();\n}\nfunction drawProjectile(){\n if(!projectile)return;ctx.save();ctx.translate(cx,projectile.y);\n ctx.fillStyle='#bdebf0';ctx.beginPath();ctx.moveTo(0,-56);ctx.lineTo(-10,-17);ctx.lineTo(10,-17);ctx.closePath();ctx.fill();\n ctx.fillStyle='#f8ffff';ctx.beginPath();ctx.moveTo(0,-56);ctx.lineTo(2,-17);ctx.lineTo(10,-17);ctx.closePath();ctx.fill();\n ctx.fillStyle='#e8b96b';ctx.fillRect(-13,-17,26,6);ctx.fillStyle='#9b4d28';rr(-10,-11,20,48,4);ctx.fill();\n ctx.strokeStyle='#d88b4b';ctx.lineWidth=3;for(let y=0;y<34;y+=11){ctx.beginPath();ctx.moveTo(-9,y);ctx.lineTo(9,y);ctx.stroke()}ctx.restore();\n}\nfunction draw(){\n if(!W||!H)return;drawBackground();if(state==='menu')return;drawLog();drawProjectile();\n}\nfunction drawParticles(dt){\n for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=p.life/p.max;ctx.fillStyle='#ffc52e';ctx.beginPath();ctx.arc(p.x,p.y,3,0,TAU);ctx.fill();ctx.globalAlpha=1}\n}\nfunction frame(t){\n if(!lastTime)lastTime=t;let dt=Math.min((t-lastTime)/1000,.04);lastTime=t;\n if(state==='playing'){\n  rotation+=spinSpeed*dt;\n  if(projectile){projectile.progress+=dt/.25;projectile.y=projectile.fromY-(projectile.fromY-(cy+R+28))*Math.min(projectile.progress,1);if(projectile.progress>=1){projectile=null;impact()}}\n  if(stagePause>0){stagePause-=dt;if(stagePause<=0&&state==='playing')newStage()}\n  draw();drawParticles(dt);\n }\n requestAnimationFrame(frame);\n}\ncanvas.addEventListener('pointerdown',e=>{\n if(state==='playing' && e.clientY>76) launch();\n});\n$('overlayButton').addEventListener('click',start);\n$('back').addEventListener('click',()=>parent.postMessage('padras-home','*'));\nresize();requestAnimationFrame(frame);\n})();\n<\/script>\n</body>\n</html>", "umbrella": "<!doctype html>\n<html lang=\"fa\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#252525\">\n<title>پادراس | سقوط چتری</title>\n<style>\n*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:white;font-family:Tahoma,Arial,sans-serif;touch-action:none}\n#app{position:relative;width:100%;height:100%;max-width:560px;margin:auto;overflow:hidden;background:#55efc7}\ncanvas{display:block;width:100%;height:100%;touch-action:none}\n#hud{position:absolute;z-index:2;top:0;left:0;right:0;height:76px;background:#303030;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:clamp(17px,4vw,21px)}\n#score{color:#ffc52e;font-weight:bold}\n#back{border:0;background:none;color:#ffc52e;font-size:31px;padding:4px 8px}\n#overlay{position:absolute;z-index:5;inset:76px 0 0;background:rgba(0,35,29,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}\n#overlay.hidden{display:none}\n#title{font-size:clamp(38px,10vw,58px);font-weight:bold;color:#ff6429;text-shadow:0 4px #5b2415;margin-bottom:20px}\n#desc{font-size:16px;line-height:2;color:#fff;margin-bottom:28px}\n#start{border:7px solid #171313;border-radius:24px;background:linear-gradient(#ff692d 0 52%,#e94d1e 52%);color:#160904;padding:16px 42px;font-size:25px;font-weight:bold;box-shadow:0 6px 0 #090509}\n#hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#064e40;font-size:13px;z-index:2;pointer-events:none}\n#leaderboardBtn{display:block;margin:0 auto 22px;border:4px solid #171313;border-radius:16px;background:#ffc52e;color:#241000;padding:12px 24px;font-size:18px;font-weight:bold;box-shadow:0 5px 0 #090509}#board{display:none; le td{padding:11px 5px;text-align:center;border-bottom:1px solid #59315e;font-size:13px}.boardTable th{background:#ff6429;color:#190a05}.boardTable tr:nth-child(even){background:#32163a}.boardEmpty{text-align:center;color:#eadbea;line-height:2;padding:24px}.boardBack{display:block;margin:18px auto;border:4px solid #171313;border-radius:14px;background:#ff6429;padding:10px 30px;font-size:18px;font-weight:bold;color:#190a05}#view{display:none;position:absolute;inset:70px 0 0;background:#000;z-index:4}#frame{width:100%;height:100%;border:0;display:block}</style></head><body><button id=\"back\">بازگشت</button><main id=\"g\"><div id=\"top\"><span>زمان: <b id=\"time\">۹۰</b></span><span>بمب: <b id=\"bombs\">۳</b></span><span>امتیاز: <b id=\"pts\">۰</b></span></div><canvas id=\"c\" width=\"440\" height=\"440\"></canvas><div id=\"controls\"><button id=\"bomb\">💣</button><div id=\"pad\"><span></span><button data-d=\"up\">▲</button><span></span><button data-d=\"left\">◀</button><button id=\"wait\">●</button><button data-d=\"right\">▶</button><span></span><button data-d=\"down\">▼</button><span></span></div></div><div id=\"msg\">با کلیدها حرکت کن و بمب بگذار!</div></main><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),N=11,S=40;let map=[],px=1,py=1,enemies=[],bombs=[],pts=0,left=90,over=false;const el=id=>document.getElementById(id);function reset(){map=Array.from({length:N},(_,y)=>Array.from({length:N},(_,a)=>y===0||a===0||y===10||a===10?1:((y%2===0&&a%2===0)||Math.random()<.16?1:0)));map[1][1]=map[1][2]=map[2][1]=0;px=py=1;enemies=[{x:9,y:1},{x:9,y:9},{x:1,y:9}];bombs=[];pts=0;left=90;over=false;el('msg').textContent='با کلیدها حرکت کن و بمب بگذار!';draw()}function draw(){x.clearRect(0,0,440,440);for(let y=0;y<N;y++)for(let a=0;a<N;a++){x.fillStyle=map[y][a]===1?'#cbd5e1':map[y][a]===2?'#64748b':'#5d963e';x.fillRect(a*S,y*S,S,S);x.strokeStyle='#172033';x.lineWidth=2;x.strokeRect(a*S,y*S,S,S);if(map[y][a]===1){x.fillStyle='#9ca3af';x.fillRect(a*S+3,y*S+4,34,4);x.fillRect(a*S+3,y*S+22,34,4)}}x.font='30px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🤖',px*S+20,py*S+21);enemies.forEach(e=>x.fillText('👾',e.x*S+20,e.y*S+20));bombs.forEach(b=>x.fillText('💣',b.x*S+20,b.y*S+20));el('pts').textContent=pts;el('time').textContent=left;el('bombs').textContent=3-bombs.length}function move(dx,dy){if(over)return;let nx=px+dx,ny=py+dy;if(nx<0||ny<0||nx>=N||ny>=N||map[ny][nx])return;px=nx;py=ny;if(enemies.some(e=>e.x===px&&e.y===py))end(false);draw()}function put(){if(over||bombs.length>=3)return;bombs.push({x:px,y:py,t:1800});draw()}function end(win){if(over)return;over=true;parent.postMessage({type:'padras-score',game:'bomber',score:pts},'*');el('msg').textContent=win?'آفرین! همه دشمن‌ها از بین رفتند.':'بازی تمام شد! برای شروع دوباره صفحه را لمس کن.'}function tick(dt){if(over)return;left-=dt/1000;if(left<=0){left=0;end(false)}bombs.forEach(b=>b.t-=dt);for(let i=bombs.length-1;i>=0;i--)if(bombs[i].t<=0){let b=bombs.splice(i,1)[0];for(let [dx,dy] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]){let xx=b.x+dx,yy=b.y+dy;if(map[yy]?.[xx]===2)map[yy][xx]=0;if(map[yy]?.[xx]===0){let n=enemies.length;enemies=enemies.filter(e=>!(e.x===xx&&e.y===yy));if(enemies.length<n)pts+=100;if(px===xx&&py===yy)end(false)}}}enemies.forEach(e=>{if(Math.random()<.025){let opts=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-.5);for(let [dx,dy] of opts){let xx=e.x+dx,yy=e.y+dy;if(map[yy]?.[xx]===0&&!(xx===px&&yy===py)){e.x=xx;e.y=yy;break}}}});if(!enemies.length)end(true);draw()}let last=0;function loop(t){tick(Math.min(40,t-last));last=t;requestAnimationFrame(loop)}document.querySelectorAll('[data-d]').forEach(b=>{let d=b.dataset.d,fn=()=>move(d==='left'?-1:d==='right'?1:0,d==='up'?-1:d==='down'?1:0);b.addEventListener('click',fn);b.addEventListener('touchstart',e=>{e.preventDefault();fn()},{passive:false})});el('bomb').onclick=put;el('wait').onclick=()=>{};el('back').onclick=()=>parent.postMessage('padras-home','*');c.onclick=()=>{if(over)reset()};reset();setInterval(()=>{if(!over)draw()},250);requestAnimationFrame(loop)})();<\/script></body></html>"};const boardKey='padras_leaderboard_v1';let boardFilter='all';function getRows(){try{return JSON.parse(localStorage.getItem(boardKey)||'[]')}catch(e){return []}}function saveScore(game,score){let name=localStorage.getItem('padras_player_name');if(!name){name=prompt('برای ثبت رکوردت، یک نام بازیکن وارد کن:');if(!name||!name.trim())name='بازیکن';name=name.trim().slice(0,18);localStorage.setItem('padras_player_name',name)}let rows=getRows(),old=rows.find(r=>r.name===name&&r.game===game);if(old){if(score>old.score){old.score=score;old.date=Date.now()}}else rows.push({name,game,score,date:Date.now()});localStorage.setItem(boardKey,JSON.stringify(rows));}function renderBoard(){let rows=getRows().filter(r=>boardFilter==='all'||r.game===boardFilter).sort((a,b)=>b.score-a.score).slice(0,50),labels={knife:'پرتاب چاقو',umbrella:'سقوط چتری',bomber:'بمب‌گذار'};let box=document.getElementById('boardContent');if(!rows.length){box.innerHTML='<div class="boardEmpty">هنوز رکوردی ثبت نشده است.<br>یک بازی انجام بده تا نامت وارد جدول شود!</div>';return}box.innerHTML='<table class="boardTable"><thead><tr><th>رتبه</th><th>بازیکن</th><th>بازی</th><th>امتیاز</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td>'+['🥇','🥈','🥉'][i]+' '+(i+1)+'</td><td>'+escapeText(r.name)+'</td><td>'+labels[r.game]+'</td><td>'+r.score+'</td></tr>').join('')+'</tbody></table>'}function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openBoard(){document.getElementById('home').style.display='none';document.getElementById('board').style.display='block';renderBoard()}function closeBoard(){document.getElementById('board').style.display='none';document.getElementById('home').style.display='block'}document.getElementById('leaderboardBtn').onclick=openBoard;document.getElementById('boardBack').onclick=closeBoard;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{boardFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderBoard()});function openGame(n){const home=document.getElementById('home'),board=document.getElementById('board'),view=document.getElementById('view'),frame=document.getElementById('frame');if(!games[n]){alert('این بازی پیدا نشد');return;}home.style.display='none';board.style.display='none';view.style.display='block';frame.srcdoc='';requestAnimationFrame(()=>{frame.srcdoc=games[n];});}window.openGame=openGame;function goHome(){document.getElementById('frame').srcdoc='';document.getElementById('view').style.display='none';document.getElementById('home').style.display='block'}addEventListener('message',e=>{if(e.data==='padras-home')goHome();if(e.data&&e.data.type==='padras-score'&&['knife','umbrella','bomber'].includes(e.data.game)&&Number.isFinite(Number(e.data.score)))saveScore(e.data.game,Math.max(0,Math.floor(Number(e.data.score))))});document.querySelectorAll('.card button').forEach((b,i)=>{b.type='button';b.addEventListener('click',()=>openGame(['knife','umbrella','bomber'][i]));});</script></body></html>
